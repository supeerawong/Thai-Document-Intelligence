[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "thaidoc"
version = "0.1.0"
description = "Extract structured, verifiable data from Thai documents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Thai Document Intelligence contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "pillow>=11,<12",
  "pytesseract>=0.3.13,<0.4",
  "typer>=0.15,<1",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "arq>=0.26,<1",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "alembic>=1.14,<2",
]
ai = ["httpx>=0.28,<1"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]
all = ["thaidoc[api,ai,dev]"]

[project.scripts]
thaidoc = "thaidoc.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/python/thaidoc",
  "apps/api/thaidoc_api",
  "apps/worker/thaidoc_worker",
]

[tool.pytest.ini_options]
pythonpath = ["packages/python", "apps/api", "apps/worker"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pytesseract"]
ignore_missing_imports = true
